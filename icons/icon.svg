<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="50%" stop-color="#06080d"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>

    <!-- Border Ring Gradient: Electric Cyan to Royal Violet -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1d9bf0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Electric Cyan Gradient for Primary Blade -->
    <linearGradient id="cyanBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#1d9bf0"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Royal Violet Gradient for Secondary Blade -->
    <linearGradient id="violetBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Shield Rim Gradient -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Drop Shadow for Foreground Emblem -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Electric Edge -->
  <rect x="5" y="5" width="118" height="118" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Radial Core Energy Glow -->
  <circle cx="64" cy="62" r="34" fill="#1d9bf0" opacity="0.14" filter="url(#softGlow)"/>

  <!-- Outer Architectural Shield Contour (Beveled Rim) -->
  <path d="M64 24 L96 35 C98 60 92 82 64 104 C36 82 30 60 32 35 Z"
        fill="#0b0f17"
        stroke="url(#shieldRim)"
        stroke-width="2"
        stroke-linejoin="round"
        filter="url(#emblemShadow)"/>

  <!-- Aerodynamic 'X' Dynamic Crossing Blades -->
  <!-- Blade 2 (Violet / Royal Purple - Back Layer) -->
  <path d="M84 38 L94 45 L47 88 L37 81 Z" fill="url(#violetBlade)" filter="url(#emblemShadow)"/>

  <!-- Blade 1 (Electric Cyan - Front Layer) -->
  <path d="M44 38 L34 45 L81 88 L91 81 Z" fill="url(#cyanBlade)" filter="url(#emblemShadow)"/>

  <!-- Central Diamond Core Prism Highlight -->
  <polygon points="64,56 71,63 64,70 57,63" fill="#ffffff" opacity="0.95"/>

  <!-- Foreground Verified Protection Crest (Crisp White Checkmark) -->
  <path d="M53 64 L61 72 L77 54"
        fill="none"
        stroke="#ffffff"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#softGlow)"/>
</svg>
