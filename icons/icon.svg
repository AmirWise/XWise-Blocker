<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d9bf0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="leftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d9bf0"/>
    </linearGradient>
    <linearGradient id="rightWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Radial Core Glow -->
  <circle cx="64" cy="62" r="32" fill="#1d9bf0" opacity="0.16" filter="url(#glow)"/>

  <!-- Outer Shield Left Facet -->
  <path d="M64 36 L34 29 C30 58 35 78 64 100 Z" fill="url(#leftWing)"/>

  <!-- Outer Shield Right Facet -->
  <path d="M64 36 L94 29 C98 58 93 78 64 100 Z" fill="url(#rightWing)"/>

  <!-- Inner Dark Shield Recess -->
  <path d="M64 41 L39 35 C36 57 41 74 64 94 C87 74 92 57 89 35 Z" fill="#0d1017" opacity="0.95"/>

  <!-- Stylized Aerodynamic X Blades -->
  <path d="M40 37 L49 35 L88 84 L79 86 Z" fill="url(#leftWing)"/>
  <path d="M88 37 L79 35 L40 84 L49 86 Z" fill="url(#rightWing)"/>

  <!-- Center Wisdom Checkmark Crest -->
  <path d="M51 63 L60 72 L77 53 L80 56 L60 77 L48 66 Z" fill="#ffffff" filter="url(#glow)"/>
</svg>